name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # numpy/scipy pinned: S17 adopted scipy for L0 numerics; a version bump can shift
      # convergence, so the version is part of the reproducibility contract (CLAUDE.md).
      - run: pip install pytest ruff hypothesis numpy==2.4.3 scipy==1.17.1
      - run: python verify.py acyclic
      - run: python verify.py layers      # semantic layer gate (L0 finance-free)
      - run: python verify.py debt
      - run: python verify.py version
      - run: python verify.py provenance
      # Signature discipline (CLAUDE.md 3b): PLR0913 max-args=5 via ruff (redesign/09).
      - run: ruff check src/pricebook_ng
      # Static-type gate: pyright over src/pricebook_ng (config: pyrightconfig.json). Pinned like
      # numpy/scipy — a pyright bump can surface new diagnostics, so the version is part of the
      # reproducibility contract. Node is preinstalled on ubuntu + windows runners.
      - run: npx -y pyright@1.1.411
      # Topic-0 rebuild: the tree climbs from L0. Bump --layer as topics add tiers.
      # (Dropped the old --layer 6 tier — it guarded the now-parked ng_parked/ tree.)
      - run: python verify.py tests --layer 0
